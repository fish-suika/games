<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>玉つぶしサンプル</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101826; color: #fff;
    font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none; word-break: auto-phrase; overflow-wrap: anywhere; line-break: strict; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
  .hud { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; padding: 10px 16px; font-weight: 700; font-size: 1.1rem; pointer-events: none; white-space: nowrap; }
  .panel { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(8,12,20,.78); text-align: center; padding: 20px; }
  .panel[hidden] { display: none; }
  .panel h1 { margin: 0; font-size: 1.6rem; text-wrap: balance; }
  .panel p { margin: 0; color: #c8d2e6; text-wrap: balance; }
  .ph { display: inline-block; }
  button { font: inherit; font-weight: 700; padding: 10px 32px; border-radius: 999px; border: 0; background: #6ea0ff; color: #0e1220; cursor: pointer; white-space: nowrap; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
</style>
</head>
<body>
<canvas id="c" aria-label="ゲーム画面"></canvas>
<div class="hud"><span>得点 <span id="score">0</span></span><span>のこり <span id="time">30</span> 秒</span></div>
<div class="panel" id="start">
  <h1>玉つぶし</h1>
  <p><span class="ph">落ちてくる玉を、</span><span class="ph">クリック・タップで</span><span class="ph">消そう。</span></p>
  <p><span class="ph">小さい玉は</span><span class="ph">2点です。</span></p>
  <button id="go" type="button">スタート</button>
</div>
<div class="panel" id="end" hidden>
  <h1>おつかれさま！</h1>
  <p>得点 <b id="final">0</b></p>
  <p>ベスト <b id="best">0</b></p>
  <button id="again" type="button">もう一度</button>
</div>
<script>
(function () {
  "use strict";
  var cv = document.getElementById("c"), ctx = cv.getContext("2d");
  var W = 0, H = 0, dpr = 1;
  var balls = [], score = 0, left = 30, running = false, last = 0, spawnT = 0;
  var $ = function (i) { return document.getElementById(i); };

  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  function spawn() {
    var small = Math.random() < 0.3;
    var r = small ? 18 : 26 + Math.random() * 14;
    r = Math.min(r, W / 8);
    balls.push({ x: r + Math.random() * Math.max(1, W - 2 * r), y: -r, r: r,
      vy: (H / 4.5) * (0.8 + Math.random() * 0.6) * (1 + (30 - left) / 40),
      pts: small ? 2 : 1, hue: Math.floor(Math.random() * 360) });
  }

  function frame(t) {
    var dt = Math.min(0.05, (t - last) / 1000 || 0); last = t;
    if (running) {
      left -= dt; spawnT -= dt;
      if (spawnT <= 0) { spawn(); spawnT = 0.35 + Math.random() * 0.35; }
      balls.forEach(function (b) { b.y += b.vy * dt; });
      balls = balls.filter(function (b) { return b.y - b.r < H; });
      $("time").textContent = Math.max(0, Math.ceil(left));
      if (left <= 0) finish();
    }
    ctx.clearRect(0, 0, W, H);
    balls.forEach(function (b) {
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7);
      ctx.fillStyle = "hsl(" + b.hue + ",80%,60%)"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "rgba(255,255,255,.7)"; ctx.stroke();
    });
    requestAnimationFrame(frame);
  }

  function finish() {
    running = false; balls = [];
    var best = 0;
    try { best = parseInt(localStorage.getItem("sample-tamatsubushi-best"), 10) || 0; } catch (e) {}
    if (score > best) { best = score; try { localStorage.setItem("sample-tamatsubushi-best", String(best)); } catch (e) {} }
    $("final").textContent = score; $("best").textContent = best;
    $("end").hidden = false;
  }

  function startGame() {
    score = 0; left = 30; balls = []; spawnT = 0; running = true;
    $("score").textContent = 0; $("time").textContent = 30;
    $("start").hidden = true; $("end").hidden = true;
  }

  cv.addEventListener("pointerdown", function (e) {
    if (!running) return;
    var x = e.clientX, y = e.clientY;
    for (var i = balls.length - 1; i >= 0; i--) {
      var b = balls[i], pad = 8;
      if ((x - b.x) * (x - b.x) + (y - b.y) * (y - b.y) <= (b.r + pad) * (b.r + pad)) {
        score += b.pts; balls.splice(i, 1); $("score").textContent = score; break;
      }
    }
  });
  $("go").addEventListener("click", startGame);
  $("again").addEventListener("click", startGame);
  requestAnimationFrame(frame);

  // 動作確認用（読み取りのみ）
  window.__game = { balls: function () { return balls.map(function (b) { return { x: b.x, y: b.y }; }); }, running: function () { return running; } };
})();
</script>
</body>
</html>
