<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIゲーム実験室のゲーム置き場</title>
<meta name="description" content="AIゲーム実験室が作った小さなブラウザゲームの置き場です。">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <h1 class="site-title"><a href="index.html">AIゲーム実験室のゲーム置き場</a></h1>
    <p class="site-meta">公開中の実験 <span id="count">-</span>件</p>
  </div>
</header>
<main class="wrap">
  <section class="intro">
    <p class="lead" data-wrap>AIでどんなゲームが作れるのか。試した結果を、実験記録として並べています。インストールは不要です。気になるものがあれば、遊んでみてください。</p>
  </section>
  <ul class="grid" id="list" aria-label="ゲーム一覧"></ul>
  <div class="empty" id="empty" hidden>公開できる実験記録がまだありません。もう少しお待ちください。</div>
</main>
<footer class="site-footer">
  <div class="wrap">
    <p class="footer-head">実験室の決まりごと</p>
    <ul class="footer-links">
      <li><a href="terms.html">利用上の注意</a></li>
      <li><a href="license.html">著作権・ライセンス</a></li>
      <li><a href="privacy.html">プライバシーについて</a></li>
    </ul>
    <p class="copy">&copy; 2026 AIゲーム実験室</p>
  </div>
</footer>
<script src="games.js"></script>
<script src="common.js"></script>
<script>
(function () {
  "use strict";
  var list = document.getElementById("list");
  var empty = document.getElementById("empty");

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function placeholder(title) {
    var ph = el("div", "thumb-ph");
    ph.appendChild(el("span", "", title));
    return ph;
  }

  function thumb(g) {
    var box = el("div", "thumb-box");
    var src = window.safeUrl(g.thumbnail);
    if (!src) { box.appendChild(placeholder(g.title)); return box; }
    var img = el("img", "thumb");
    img.alt = g.title + "のサムネイル";
    img.loading = "lazy";
    img.onerror = function () {
      img.onerror = null;
      if (img.parentNode) img.parentNode.replaceChild(placeholder(g.title), img);
    };
    img.src = src;
    box.appendChild(img);
    return box;
  }

  function playButton(g) {
    var url = window.safeUrl(g.url);
    if (!url) {
      var b = el("button", "btn", "準備中");
      b.type = "button";
      b.disabled = true;
      return b;
    }
    var a = el("a", "btn", "遊ぶ");
    if (g.mode === "external") {
      a.href = url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.setAttribute("aria-label", g.title + "を新しいタブで遊ぶ");
    } else {
      a.href = url; // 上にバーを出さず、ゲームを画面いっぱいに使えるよう同じタブで直接開く
      a.setAttribute("aria-label", g.title + "を遊ぶ");
    }
    return a;
  }

  function field(dl, name, value) {
    dl.appendChild(el("dt", "", name));
    var dd = el("dd");
    dd.appendChild(window.wrapPhrases(value));
    dl.appendChild(dd);
  }

  function card(g, no) {
    var li = el("li", "card");
    li.appendChild(el("div", "card-top", "実験 No." + (no < 10 ? "0" : "") + no));
    li.appendChild(thumb(g));
    var body = el("div", "card-body");
    var title = String(g.title || "（無題）");
    var h = el("h3", "card-title");
    h.appendChild(window.wrapPhrases(title));
    h.title = title;
    body.appendChild(h);
    var dl = el("dl", "rec-table");
    field(dl, "分類", String(g.genre || ""));
    field(dl, "実験内容", g.description || "");
    body.appendChild(dl);
    body.appendChild(playButton(g));
    li.appendChild(body);
    return li;
  }

  try {
    var games = window.getGames().filter(function (g) { return g && typeof g === "object"; });
    if (!games.length) throw new Error("empty");
    // 新しい作品が先頭なので、末尾が No.01、先頭が最大
    games.forEach(function (g, i) { list.appendChild(card(g, games.length - i)); });
    document.getElementById("count").textContent = games.length;
  } catch (e) {
    list.hidden = true;
    empty.hidden = false;
  }
})();
</script>
</body>
</html>
