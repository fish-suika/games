<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>遊ぶ - AIゲーム実験室のゲーム置き場</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="play">
<header class="playbar">
  <a class="back tool" href="index.html">&larr; 一覧へ</a>
  <h1 class="play-title" id="ptitle">読み込み中…</h1>
</header>
<div class="message" id="msg" hidden>
  <p id="msgText"></p>
  <p><a class="btn" href="index.html">一覧へ戻る</a></p>
</div>
<script src="games.js"></script>
<script src="common.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };

  function showMessage(text) {
    $("ptitle").textContent = "表示できません";
    $("msgText").textContent = "";
    $("msgText").appendChild(window.wrapPhrases(text));
    $("msg").hidden = false;
  }

  var id = new URLSearchParams(location.search).get("id");
  var game = null;
  if (id) {
    window.getGames().forEach(function (g) { if (!game && g && g.id === id) game = g; });
  }
  if (!id || !game) {
    showMessage("指定されたゲームが見つかりませんでした。一覧から選び直してください。");
    return;
  }
  var url = window.safeUrl(game.url);
  if (!url) {
    $("ptitle").textContent = String(game.title || "");
    showMessage("このゲームは準備中です。公開までもう少しお待ちください。");
    return;
  }

  // 以前の play.html?id= のリンク用：上のバーを出さず、ゲームのページへそのまま移る
  location.replace(url);
})();
</script>
</body>
</html>
